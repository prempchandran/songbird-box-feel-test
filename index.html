<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Songbird Box · feel test</title>
<style>
  :root { --ink: #1f2c45; --paper: #f6efdf; --kraft: #b07f4f; --sodium: #f0a03c; }
  html, body { margin: 0; height: 100%; background: #1b2436; color: var(--paper); font-family: system-ui, sans-serif; overflow: hidden; }
  #c { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; left: 16px; right: 16px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  button { font: 600 16px system-ui, sans-serif; padding: 12px 18px; border-radius: 12px; border: 0; background: var(--sodium); color: var(--ink); cursor: pointer; min-height: 44px; }
  button.ghost { background: rgba(246,239,223,0.12); color: var(--paper); }
  #msg { font-size: 14px; line-height: 1.4; max-width: 560px; background: rgba(15,20,32,0.7); padding: 10px 14px; border-radius: 10px; }
</style>
<script type="importmap">{ "imports": { "three": "./three.module.min.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button id="enter" hidden>Enter mixed reality</button>
  <button id="reset" class="ghost">Reset parts</button>
  <button id="back" class="ghost">Back a step</button>
  <button id="skip" class="ghost">Skip step</button>
  <div id="msg">Follow the steps on the board. Desktop preview: drag parts with the mouse; hold Shift while dragging to lift a part; scroll over a loose part to scale it; double-click a joint to lock it; press P to pause. Version v8. On a Quest, press <b>Enter mixed reality</b>.</div>
</div>
<div id="perf" style="position:fixed;right:16px;bottom:16px;font:12px system-ui,sans-serif;color:rgba(246,239,223,0.6);pointer-events:none"></div>
<script type="module" src="./main.js?v=8"></script>
</body>
</html>
